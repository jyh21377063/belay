# =====================================================================
# 运行编排
#
# 用法（在 belay/ 目录下）：python -m eval.run --profile <名称> [覆盖参数]
#   覆盖参数：--split --benchmarks --tasks --agent --model --repeats
#            --concurrency --timeout-min --run-id --source-run --keep-containers
#            -y（不询问） --dry-run（只打印计划与 Pier 配置）
#
# 选题规则：
#   split       必填，test 或 dev
#   benchmarks  all 或列表 / 逗号分隔；默认 all
#   tasks       all 或题目列表；可写短 id（google__langextract-239）
#               或完整标识（promax/google__langextract-239）；
#               短 id 在所选 split 内必须唯一，且必须属于所选 benchmarks
#
# 结果目录：../results/<run_id>/<benchmark>/<id>/<repeat>/
# 同一 run_id 重跑即断点续跑：已完成的 trial 自动跳过
# =====================================================================

version: 1
# 相对路径均相对于本文件所在目录（belay/）；tasks/ 与 results/ 放在 belay/ 同级，不进 git
tasks_file: tasks.yaml
task_dirs: ../tasks                   # 由 python -m eval.prepare 生成，可随时重建
results_root: ../results              # 运行结果：<results_root>/<run_id>/<benchmark>/<id>/<repeat>/

defaults:
  benchmarks: all
  tasks: all
  repeats: 1
  concurrency: 2              # 8 vCPU / 32 GiB 下建议 ≤ 2；LHTB 的 duckdb、riscv 各需 4 核 8 GB
  timeout_min: 90             # 每题统一的 agent 预算（覆盖 task.toml 中的 agent 超时，含 LHTB 原本 1–6 h 的设置）
  environment: docker
  grading:
    inline_verify: true       # agent 结束后在原容器里也跑一次 verifier，用于和重放结果对账
  keep_containers: false
  run_id: "{profile}-{agent}-{split}-{date}"
  # 网络：不再在这里写白名单。任务的 task.toml 统一 allow_internet = false（prepare 会强制），
  # Pier 只放行 agent 自己声明的域名（claude-code 即 ANTHROPIC_BASE_URL 的域名）。

# ---------------------------------------------------------------------
# Agent 定义
#   name        Pier 内置 agent；import_path 自定义 agent（二选一）
#   model       模型名（--model 可覆盖）
#   env         传给 agent 的环境变量；${VAR} 由 Pier 在运行时从宿主机展开，不写入任何文件
#   kwargs      传给 agent 构造函数的参数
#   grade       replay（默认：导出补丁，在全新容器重放评分）或 inline（用原容器的 verifier 结果）
# ---------------------------------------------------------------------
agents:
  oracle:
    name: oracle
    grade: inline

  nop:
    name: nop
    grade: inline

  claude-code: &claude_code   # A 组：Pier 的 ClaudeCode + 补丁导出（Claude Code 由 Pier 装进每道题的容器）
    import_path: "eval.agents.claude_code:ClaudeCodeWithPatch"
    model: "deepseek-flash[1m]"         # 即 ANTHROPIC_MODEL；[1m] 告诉 Claude Code 上下文为 1M
    env: &claude_code_env               # 按 DeepSeek 官方推荐配置；这里的值会覆盖 Pier 的默认设置
      ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
      ANTHROPIC_AUTH_TOKEN: ${DEEPSEEK_API_KEY}
      ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-flash[1m]"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-flash[1m]"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-flash
      CLAUDE_CODE_SUBAGENT_MODEL: deepseek-flash
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "786432"
      API_TIMEOUT_MS: "600000"
      DISABLE_AUTOUPDATER: "1"          # 容器内不联网，禁止 Claude Code 自动更新
    kwargs: &claude_code_kwargs
      reasoning_effort: max             # 即 CLAUDE_CODE_EFFORT_LEVEL=max，Pier 以 --effort max 传入
      version: "2.1.281"                # 固定 Claude Code 版本（从 npm 安装），保证各次运行一致
      # 构建镜像时下载 Node.js 与 npm 包的来源；默认官方源，访问慢时可换镜像：
      # node_mirror: https://npmmirror.com/mirrors/node
      # npm_registry: https://registry.npmmirror.com
      # repo_dir: /testbed              # 仅当容器工作目录不在仓库内时需要
    pricing: &claude_code_pricing       # 汇总表估算成本用（元 / 百万 tokens）；按高峰价，即成本上限
      currency: CNY                     # 空闲时段单价减半：0.02 / 1 / 4，成本也减半
      input_hit_per_m: 0.04             # 输入（缓存命中）
      input_miss_per_m: 2               # 输入（缓存未命中）
      output_per_m: 8                   # 输出

  # 以下两组与 A 组共用模型、环境变量、Claude Code 版本与价格（YAML 锚点），只在 harness 上不同
  claude-code-gate:           # A-gate 组：Claude Code + 确定性回归门（Stop hook）
    <<: *claude_code
    import_path: "eval.agents.claude_code_gate:ClaudeCodeGate"
    gate: true                          # runner 读取任务目录下的 gate.json（目前仅 SWE-EVO 转换器生成）
    setup_timeout_min: 150              # setup 阶段在原始代码上跑两次基线测试，不计入 90 分钟预算
    kwargs:
      <<: *claude_code_kwargs
      max_blocks: 5                     # 最多拦截 5 次，之后放行并记录

  claude-code-pee:            # PEE 组：基于 Claude Code 的朴素 planner → executor → evaluator
    <<: *claude_code
    import_path: "eval.agents.claude_code_pee:ClaudeCodePEE"
    kwargs:
      <<: *claude_code_kwargs
      max_rounds: 5                     # evaluator 最多评估 5 轮

  flat: &flat                 # B 组：自研执行器（参照 Claude Code 重新实现），单 worker，无证据图
    import_path: "eval.agents.flat_agent:FlatAgent"
    model: deepseek-flash               # 与 A 组同一模型（Claude Code 里的 deepseek-flash[1m]）
    env:                                # 模型调用从宿主机发出，容器不需要联网
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
    kwargs: &flat_kwargs
      effort: max                       # 对应 A 组的 --effort max；若接口报错改为 high
      thinking: true
      max_tokens: 64000
      budget_min: 90                    # 与 timeout_min 保持一致
      record: true                      # 录制模型回复，调试 runtime 时可回放
      explore: true                     # 提供只读探索子 agent（对应 Claude Code 的 Explore）；模型可以不用
      clear_tokens: 500000              # 与 A 组对齐：Claude Code 约在 78.6 万 token 压缩
      reset_tokens: 750000
      # policy: {git_write: audit, network: audit, disk_search: audit, harness_paths: deny}   # 默认值
    pricing: *claude_code_pricing

  belay: &belay               # Belay 组：自研 worker + 证据图 runtime（v4）
    <<: *flat
    import_path: "eval.agents.belay_agent:BelayAgent"
    gate: true                          # runner 读取任务目录下的 gate.json 作为测试配置（目前仅 SWE-EVO 生成）
    setup_timeout_min: 150              # setup 阶段在原始代码上跑两次基线，不计入 90 分钟预算
    kwargs: &belay_kwargs
      <<: *flat_kwargs
      workers: 1                        # Belay-1；M5 起可改为 3
      runtime: &belay_runtime           # belay/config.py 的 RuntimeConfig；每个机制都可以关掉
        gate: block                     # block | advise（只提示不拒绝）| off
        checkpoint_gate: related        # 检查点只跑与改动相关的测试文件
        final_gate: full                # 最终提交跑全量；剩余时间不够时自动降为 related
        test_author: true
        test_author_quota: 8
        reports: true
        isolation: true                 # worker 以低权限用户运行；建不了用户时自动退回 root 并记录

  # 分阶段验收：同一套 runtime 关掉部分机制（对应 M2 / M3）
  belay-m2:                   # 作业 + 证据图 + run_check / wait / ledger；submit 直接合并，不跑门禁
    <<: *belay
    kwargs:
      <<: *belay_kwargs
      runtime: {<<: *belay_runtime, gate: "off", protect_tests: false, test_author: false, reports: false}

  belay-m3:                   # 加上门禁、集成分支、测试保护、截止保护；不启用独立测试与上报
    <<: *belay
    kwargs:
      <<: *belay_kwargs
      runtime: {<<: *belay_runtime, test_author: false, reports: false}

# ---------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------
profiles:

  gold-check:                 # 参考解两次通过 + 空补丁失败；不调用模型
    split: dev                # 验证评测集：--split test
    steps:
      - {agent: oracle, repeats: 2, expect: pass}
      - {agent: nop,    repeats: 1, expect: fail}
    concurrency: 2            # 评测集含 Rust / C++ 完整编译，并发不宜过高
    grading: {inline_verify: true}

  cc-pilot:                   # Claude Code 试跑（调试集）：保留容器、原容器与重放双重评分，便于排查
    split: dev
    agent: claude-code
    repeats: 1
    concurrency: 1
    keep_containers: true

  # 正式评测：每题先跑 1 次；需要第 2 次时用同一 run_id 加 --repeats 2 补跑。
  # 流程已验证，只做重放评分（正式成绩），不再在原容器重复评分。
  gate-pilot:                 # A-gate 组试跑（调试集）
    split: dev
    agent: claude-code-gate
    repeats: 1
    concurrency: 1

  pee-pilot:                  # PEE 组试跑（调试集）
    split: dev
    agent: claude-code-pee
    repeats: 1
    concurrency: 1

  cc-test:                    # A 组
    split: test
    agent: claude-code
    repeats: 1
    grading: {inline_verify: false}

  gate-test:                  # A-gate 组
    split: test
    agent: claude-code-gate
    repeats: 1
    grading: {inline_verify: false}

  pee-test:                   # PEE 组
    split: test
    agent: claude-code-pee
    repeats: 1
    grading: {inline_verify: false}

  flat-dev:                   # B 组调试：先在调试集上与 A 组对跑（M1 的通过标准）
    split: dev
    agent: flat
    repeats: 1
    keep_containers: true

  flat-test:                  # B 组
    split: test
    agent: flat
    repeats: 1
    grading: {inline_verify: false}

  belay-dev:                  # Belay 调试（完整机制）；分阶段验收用 --agent belay-m2 / belay-m3
    split: dev
    agent: belay
    repeats: 1
    keep_containers: true

  belay-test:                 # Belay 组正式评测（Belay-1 与并发组改 agents.belay.kwargs.workers）
    split: test
    agent: belay
    repeats: 1
    grading: {inline_verify: false}

  regrade:                    # 对已有补丁重新评分，不调用模型；调试集结果需加 --split dev
    split: test
    grading_only: true
    source_run: "<run_id>"    # 用 --source-run 指定

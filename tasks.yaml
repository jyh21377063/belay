# =====================================================================
# 评测任务清单（第 2 版）
#
# 结构：
#   benchmarks:   各数据集的公共信息（数据位置、判分方式、给 agent 的输入字段）
#   test:         正式集，按数据集分组。最终结果只来自这里
#                 role: negative_control 为负对照（预期 runtime 无收益）
#   dev:          调试集。开发机制时使用，不进最终报告
#   backups:      备选题，按顺序替换
#   replacements: 替换记录
#   revisions:    选题修订记录
#
# 题目的完整标识为 "<benchmark>/<id>"，例如 swe_evo/iterative__dvc_2.8.1_2.8.2
# 转换后的任务目录统一为 <父目录>/tasks/<benchmark>/<id>/（Pier / Harbor 格式），由 python -m eval.prepare 生成
# 相对路径均相对于本文件所在目录（belay/）；benchmarks/、tasks/、results/ 都与 belay/ 同级
# 选题依据见 task_selection.md；SWE-EVO 全部 48 题的指标见 docs/sweevo_catalog.md
# =====================================================================

version: 2
frozen_at: "2026-09-25"

benchmarks:
  promax:
    name: SWE-Bench ProMax
    data: ../benchmarks/promax/swe-bench-promax.json
    eval_scripts: ../benchmarks/promax/eval.json
    task_format: convert            # eval/convert/promax_to_harbor.py
    image_template: "key4127/refactor-dockerhub:{id}"
    instruction_fields: [problem_statement]   # 不得包含 hints_text（由参考答案生成）
    grading: all_tests_pass
    grading_mode: replay            # 导出补丁，在全新容器中重放评分

  deepswe:
    name: DeepSWE
    data: ../benchmarks/deep-swe/tasks
    task_format: native             # 原生 Harbor 格式，直接复制任务目录
    image_template: null            # 镜像写在各任务的 task.toml 中
    instruction_fields: [instruction.md]
    grading: functional_verifier
    grading_mode: replay            # 重放时应用补丁后自动 commit（其 grader 只评已提交的改动）

  swe_evo:
    name: SWE-EVO
    data: ../benchmarks/SWE-EVO/hf_out/hf_jsonl/swe-evo.jsonl
    task_format: convert            # eval/convert/sweevo_to_harbor.py
    image_template: null            # 各题镜像见下方 image 字段
    instruction_fields: [problem_statement]
    instruction_setting: release_note_only
    instruction_cleanup: [strip_urls]         # 删除 release notes 中的 PR / 文档链接
    repo_sanitize: single_commit              # 容器内仓库重建为单一提交，去除后续历史
    grading: all_tests_pass
    grading_mode: replay
    extra_metrics: [fix_rate]

  lhtb:
    name: Long-Horizon Terminal-Bench
    data: ../benchmarks/LHTB/tasks
    source: https://github.com/zli12321/LHTB
    commit: d78f5eb52ad754c5ee9154741af73130a85a65b8   # 2026-09-15；python -m eval.tools.fetch_lhtb 按此版本下载
    task_format: native             # 原生 Harbor 格式；prepare 时关闭 continue_until_timeout、禁止联网
    image_template: null            # task.toml 的 environment.docker_image（预构建镜像）
    instruction_fields: [instruction.md]
    grading: official_verifier      # 隐藏评分器，按产物重建后评分，reward ∈ [0, 1]
    grading_mode: official          # 由 Pier 按题目配置评分（同容器或独立评分容器），不做补丁重放
    solved_threshold: 0.95          # LHTB 口径：reward ≥ 0.95 视为解出

# ---------------------------------------------------------------------
# 正式集（16 道 = SWE-EVO 7 + ProMax 3 + LHTB 4 + 负对照 2）
